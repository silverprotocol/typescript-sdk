name: CI

# Runs on the standalone typescript-sdk repo (this directory is the repo root
# there). Inside the private workspace/guuey supertrees this file is inert.
# Keyless: no secrets, no LLM calls — replay/census/convergence are the
# deterministic conformance gates (audit B11).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: typecheck + tests + conformance replay (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 22: the published packages' engines floor major (latest 22.x; they
        # use no Node API, so one V8 covers every 22.x minor). 24: current.
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm spec-drift
      - run: pnpm api-surface
      - run: pnpm fixture-drift
      - run: pnpm test
      - run: pnpm e2e:replay

  pack-smoke:
    name: pack → install → import + require smoke (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm pack:smoke
