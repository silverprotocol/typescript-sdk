# Standalone workspace root for github.com/silverprotocol/typescript-sdk (open source).
# Subtree-vendored into the PRIVATE SilverProtocol workspace at sdks/typescript.
# When vendored inside guuey, guuey's ROOT pnpm-workspace.yaml governs (it globs
# `silverprotocol/sdks/typescript/packages/*`); this file is only read when the SDK is
# built standalone.
packages:
  - "packages/*"
# pnpm 11's build-approval gate (ERR_PNPM_IGNORED_BUILDS) fails a cold
# `pnpm install` unless every dependency with a lifecycle script has an
# explicit decision recorded here. Note: pnpm 11.2.2 does NOT read a
# `pnpm.onlyBuiltDependencies` field from package.json (it warns "The
# 'pnpm' field in package.json is no longer read by pnpm") and does NOT
# honor `onlyBuiltDependencies:` in this file either — verified empirically
# via `pnpm install` on a cold clone. The key pnpm 11 actually reads (and
# auto-suggests via its own ERR_PNPM_IGNORED_BUILDS hint) is `allowBuilds`,
# a per-package boolean map; every ignored-build package must be listed
# explicitly (an empty/absent map still errors). No entry needs its
# install script for this SDK (native/CLI extras unused by the test suite).
# Verified: `pnpm install && pnpm typecheck && pnpm test && pnpm e2e:replay`
# all green on a fresh clone with every entry set to `false`. Pruned
# 2026-09-02: esbuild (gone with vite 8 / vitest 4), sqlite3 + cpu-features +
# ssh2 (gone with @google/adk 2.0.0's optional mikro-orm peers) — re-add an
# entry only when `pnpm install` names the package in ERR_PNPM_IGNORED_BUILDS.
allowBuilds:
  '@google/genai': false
  protobufjs: false
  # 2026-09-23: @google/adk 2.1.0 adds dockerode as an optionalDependency, which
  # pulls ssh2 + cpu-features back in (both run install scripts). Without these
  # two lines every strict-builds install fails ERR_PNPM_IGNORED_BUILDS. Neither
  # native build is used by this SDK (no Docker sandbox on any tested path).
  cpu-features: false
  ssh2: false
# Security overrides for transitive deps our peers pin below the patched
# release. Each line names the advisory and the pin that forces it; retire an
# entry as soon as upstream moves (re-check every sweep). pnpm 11 reads
# `overrides` ONLY from this file (the package.json `pnpm` field is ignored).
# scripts/nightly-peer-leg.mjs MERGES its forced-peer entries into this stanza
# on a throwaway CI checkout — keep the key name and the two-space indent.
overrides:
  'uuid@<11.1.1': '^11.1.1'           # GHSA-w5hq-g745-h8pq; vertexai -> google-auth-library@9 -> gaxios@6 -> uuid ^9
  '@modelcontextprotocol/client': '>=2.2.0'  # GHSA-6qxp-vccf-f47h (high; >=2.0.0 <2.2.0, fixed 2.2.0),
                                      # 2026-10-07: @openai/agents-core 0.19.0 declares the client as an
                                      # optional ^2.0.0 and the lockfile held 2.0.0. Retire when agents-core
                                      # declares ^2.2.0 or higher.
# minimumReleaseAgeExclude ritual (pnpm >=11.9.0): the evaluator UNIONS every
# rule for the same package name (pnpm/pnpm#12463 fixed the 11.2.2 first-
# name-match quirk this comment used to describe), so during a day-one peer
# bump either write ONE `pkg@old || new` entry or list both versions — both
# forms work. Entries older than the 24h default window are dead weight:
# prune them on the next bump. Every entry below is load-bearing as of
# 2026-10-07T07:01Z (claude-agent-sdk 0.3.292 + 8 platform siblings 2026-10-06T17:02-17:14Z;
# @google/adk 2.2.1 10-06T22:21Z; ai 7.0.130, @ai-sdk/openai 4.0.86, @ai-sdk/mcp 2.0.69,
# @ai-sdk/provider 4.0.24, @ai-sdk/provider-utils 5.0.56 and @ai-sdk/gateway 4.0.106
# 10-07T01:41-01:47Z). openai is resolved through a RANGE (@openai/agents-openai
# declares ^7.2.0), so on a FRESH resolution (lockfile deleted) a missing entry does
# NOT fail: the gate silently resolves an older client; against the committed
# lockfile it fails ERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION. openai@7.30.0 (10-06T21:59Z)
# is deliberately ABSENT: the lockfile keeps openai 7.22.0. Also absent because they
# aged out before the install: @openai/agents* 0.19.0 (10-05), @google/genai 2.27.0
# (10-02), @modelcontextprotocol/sdk 1.32.1 (10-05), @anthropic-ai/sdk 0.131.0
# (09-30). NOTE (pnpm 11.25): a non-frozen
# install APPENDS any too-young version NO older release can satisfy (an exact pin,
# or a caret whose floor is the new release) to this list and reflows the comments; always `git diff` both yaml files after installing.
minimumReleaseAgeExclude:
  - '@anthropic-ai/claude-agent-sdk@0.3.292'
  - '@anthropic-ai/claude-agent-sdk-darwin-arm64@0.3.292'
  - '@anthropic-ai/claude-agent-sdk-darwin-x64@0.3.292'
  - '@anthropic-ai/claude-agent-sdk-linux-arm64@0.3.292'
  - '@anthropic-ai/claude-agent-sdk-linux-arm64-musl@0.3.292'
  - '@anthropic-ai/claude-agent-sdk-linux-x64@0.3.292'
  - '@anthropic-ai/claude-agent-sdk-linux-x64-musl@0.3.292'
  - '@anthropic-ai/claude-agent-sdk-win32-arm64@0.3.292'
  - '@anthropic-ai/claude-agent-sdk-win32-x64@0.3.292'
  - '@google/adk@2.2.1'
  - ai@7.0.130
  - '@ai-sdk/openai@4.0.86'
  - '@ai-sdk/mcp@2.0.69'
  - '@ai-sdk/provider@4.0.24'
  - '@ai-sdk/provider-utils@5.0.56'
  - '@ai-sdk/gateway@4.0.106'
